name: Fix Ahead camera once

on:
  push:
    paths:
      - .github/workflows/fix-ahead-camera-once.yml

permissions:
  contents: write

jobs:
  fix-ahead-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch actual Ahead camera transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('vite.ahead.config.js')
          text = path.read_text()

          def modify_decl(name, replacements):
              global text
              pattern = re.compile(rf'^\s*const {re.escape(name)} = `.*`\s*$', re.MULTILINE)
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one declaration for {name}, got {len(matches)}')
              match = matches[0]
              line = match.group(0)
              for old, new in replacements:
                  count = line.count(old)
                  if count != 1:
                      raise SystemExit(f'Expected one {old!r} in {name}, got {count}')
                  line = line.replace(old, new, 1)
              text = text[:match.start()] + line + text[match.end():]

          modify_decl('opticalState', [
              (r'const AHEAD_CAMERA_Z = 3.55\nconst AHEAD_MIN_FOV = 6',
               r'const AHEAD_CAMERA_Z = RADIUS + 0.38\nconst AHEAD_CAMERA_BACK = 0.82\nconst AHEAD_LOOK_AHEAD = 1.45\nconst AHEAD_LOOK_HEIGHT = RADIUS + 0.10\nconst AHEAD_MIN_FOV = 6')
          ])

          modify_decl('anchoredTargetNormal', [
              ('aheadTargetNormal()', 'new THREE.Vector3(0, 0, 1)')
          ])

          chase_pose = [
              ('camera.position.set(0, 0, AHEAD_CAMERA_Z)', 'camera.position.set(0, -AHEAD_CAMERA_BACK, AHEAD_CAMERA_Z)'),
              ('camera.up.set(0, 1, 0)', 'camera.up.set(0, 0, 1)'),
              ('camera.lookAt(0, 0, 0)', 'camera.lookAt(0, AHEAD_LOOK_AHEAD, AHEAD_LOOK_HEIGHT)')
          ]
          modify_decl('opticalFocusBlock', chase_pose)
          modify_decl('opticalSetZoom', chase_pose)
          modify_decl('opticalAheadEntry', chase_pose)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.ahead.config.js
          git diff --cached --check
          git commit -m "Fix Ahead view to look toward horizon"
          git push origin HEAD:main
