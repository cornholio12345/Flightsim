name: Build signed Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (for example 0.1.6)'
        required: true
        default: '0.1.6'
      version_code:
        description: 'Version code (must increase for Play updates)'
        required: true
        default: '7'
  push:
    branches:
      - main
    paths:
      - '.github/release-trigger'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION_NAME: ${{ inputs.version_name || '0.1.6' }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code || '7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured as a repository Actions secret"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.cornholio12345.flightsim",
            "appName": "FlightSim",
            "webDir": "dist",
            "plugins": {
              "CapacitorHttp": { "enabled": true }
            }
          }
          JSON

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Enable GPS permissions and set version
        env:
          VERSION_NAME: ${{ env.RELEASE_VERSION_NAME }}
          VERSION_CODE: ${{ env.RELEASE_VERSION_CODE }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = (
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
          )
          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              text = text.replace('<application', permissions + '    <application', 1)
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          version_code = os.environ['VERSION_CODE']
          version_name = os.environ['VERSION_NAME']
          if not version_code.isdigit() or int(version_code) < 1:
              raise SystemExit('VERSION_CODE must be a positive integer')
          if not re.fullmatch(r'[0-9A-Za-z._-]+', version_name):
              raise SystemExit('VERSION_NAME contains unsupported characters')
          text, code_count = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', text, count=1)
          text, name_count = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not update Android version fields')
          gradle.write_text(text)
          PY

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ['ANDROID_KEYSTORE_BASE64']
          start = raw.find('/u3+7Q')
          if start >= 0:
              raw = raw[start:]
          raw = ''.join(raw.split())
          raw = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          try:
              decoded = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit(f'ANDROID_KEYSTORE_BASE64 is not valid base64: {exc}')
          if not decoded.startswith(bytes.fromhex('FEEDFEED')):
              raise SystemExit('Decoded signing secret is not a JKS keystore')
          path = Path(os.environ['RUNNER_TEMP']) / 'flightsim-upload.jks'
          path.write_bytes(decoded)
          if path.stat().st_size < 1000:
              raise SystemExit('Decoded keystore is unexpectedly small')
          print(f'Restored JKS keystore ({path.stat().st_size} bytes)')
          PY
          chmod 600 "$RUNNER_TEMP/flightsim-upload.jks"

      - name: Verify upload keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/flightsim-upload.jks" \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias flightsim-upload >/dev/null

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/flightsim-release-aligned.apk"
          SIGNED="$RUNNER_TEMP/flightsim-${RELEASE_VERSION_NAME}-release.apk"
          test -f "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/flightsim-upload.jks" \
            --ks-type JKS \
            --ks-key-alias flightsim-upload \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"

      - name: Collect APK
        run: |
          mkdir -p release
          cp "$RUNNER_TEMP/flightsim-${RELEASE_VERSION_NAME}-release.apk" release/
          ls -lh release/

      - name: Publish direct APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${RELEASE_VERSION_NAME}"
          APK="release/flightsim-${RELEASE_VERSION_NAME}-release.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FlightSim ${RELEASE_VERSION_NAME}" \
              --notes "Signed Android APK for FlightSim ${RELEASE_VERSION_NAME}."
          fi
