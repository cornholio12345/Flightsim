name: Android APK Build (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: $RUNNER_TEMP/android-sdk

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sS -L https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/" || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses <<< 'y' || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Install npm deps
        run: npm ci

      - name: Build web assets
        run: |
          npm run build --if-present || npm run build

      - name: Prepare Android project (Capacitor/Cordova)
        run: |
          if [ -f "capacitor.config.ts" ] || [ -f "capacitor.config.json" ]; then
            npx cap sync android || true
          fi
          if [ -f "config.xml" ] && [ -d "www" ]; then
            if ! command -v cordova >/dev/null 2>&1; then
              npm i -g cordova
            fi
            cordova platform add android --no-update || true
          fi

      - name: Build Android release with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew || true
          ./gradlew clean assembleRelease --no-daemon

      - name: Find APK
        id: findapk
        run: |
          unsigned=$(find android -type f -path "*/outputs/apk/*/app-*-unsigned.apk" -print -quit || true)
          if [ -z "$unsigned" ]; then
            unsigned=$(find android -type f -path "*/outputs/apk/*/app-release.apk" -print -quit || true)
          fi
          built=$(find android -type f -name "*-release.apk" -print -quit || true)
          echo "unsigned_apk=$unsigned" >> $GITHUB_OUTPUT
          echo "built_apk=$built" >> $GITHUB_OUTPUT
          echo "unsigned_apk=$unsigned"
          echo "built_apk=$built"

      - name: Upload APK artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-unsigned
          path: |
            ${{ steps.findapk.outputs.unsigned_apk }}
            ${{ steps.findapk.outputs.built_apk }}
