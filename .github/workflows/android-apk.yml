name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Ahead projection geometry
        run: npm run check:ahead

      - name: Build web app
        run: npm run build

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.cornholio12345.flightsim",
            "appName": "FlightSim",
            "webDir": "dist",
            "plugins": {
              "CapacitorHttp": { "enabled": true }
            }
          }
          JSON

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Enable GPS permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              text = text.replace('<application', permissions + '    <application', 1)
          path.write_text(text)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flightsim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
